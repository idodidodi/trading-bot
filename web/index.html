<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Divergence dashboard</title><link rel="icon" type="image/svg+xml" href="/web/favicon.svg"><link rel="stylesheet" href="/web/style.css"></head><body>
<header><div><span class="eyebrow">MARKET RESEARCH / LIVE MONITOR</span><h1>Divergence dashboard</h1></div><span id="connection"></span></header>
<nav><a href="/">Overview</a><a href="/signals">Signals</a><a href="/logs">Logs</a><a href="/backtest">Backtests</a><a href="/assets">Assets</a></nav>
<div id="login" hidden><p>Sign in to your private online dashboard.</p><input id="email" type="email" placeholder="Email" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="signin" type="button">Sign in</button><button id="forgot-password" type="button">Forgot password?</button><button id="magic-link" type="button">Email me a sign-in link</button></div>
<div id="invite-setup" hidden><p>Choose a new password to finish setting up your dashboard account.</p><input id="invite-password" type="password" placeholder="New password" autocomplete="new-password"><input id="invite-password-confirm" type="password" placeholder="Confirm password" autocomplete="new-password"><button id="accept-invite" type="button">Set password and continue</button></div>
<div id="status" role="status" aria-live="polite"></div><main id="content"></main>
<dialog id="candle-dialog" aria-labelledby="candle-title"><header><h2 id="candle-title">Signal candles</h2><button id="close-chart">Close</button></header><div id="candle-actions"></div><p id="candle-note"></p><p id="candle-legend" class="muted"></p><div id="chart"></div><div id="candle-table" class="scroll"></div></dialog>
<dialog id="backtest-dialog" aria-labelledby="backtest-title"><header><h2 id="backtest-title">Configure backtest</h2><button id="close-backtest" type="button">Close</button></header><form id="backtest-form"></form></dialog>
<dialog id="followup-dialog" aria-labelledby="followup-title"><header><h2 id="followup-title">Signal follow-up</h2><button id="close-followup" type="button">Close</button></header><div id="followup-content"></div></dialog>
<script src="/web/config.js"></script><script type="module" src="/web/app.js"></script></body></html>
