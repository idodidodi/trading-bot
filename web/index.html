<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Divergence dashboard</title><link rel="stylesheet" href="/web/style.css"></head><body>
<header><h1>Divergence dashboard</h1><span id="connection"></span></header>
<nav><a href="/">Overview</a><a href="/signals">Signals</a><a href="/logs">Logs</a><a href="/backtest">Backtests</a><a href="/assets">Assets</a></nav>
