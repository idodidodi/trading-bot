[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-trading-executor"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["certifi", "tzdata"]

[project.scripts]
signal-trading-executor = "runner:main"
signal-trading-admin = "admin:main"

[tool.setuptools]
py-modules = ["runner", "admin", "runtime_store", "signal_client", "demo_execution", "paper_trading", "execution_gateway", "momentum_policy", "market_calendar", "stock_policy", "position_monitor", "momentum_tracking", "momentum_review", "candles", "migrate", "chase_simulation", "return_research", "compare_chase_variants"]
