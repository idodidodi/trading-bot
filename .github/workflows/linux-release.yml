name: Linux standalone release
on:
  workflow_call:
    inputs:
      release_version:
        required: true
        type: string
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: trading_bot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TRADING_TEST_DATABASE_URL: host=127.0.0.1 port=5432 dbname=trading_bot_test user=postgres password=test-only sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set coordinated build version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python scripts/release-version.py apply
      - name: Install runtime and build dependencies
        run: python3 -m pip install -r windows-build-requirements.txt
      - name: Verify scanner and updater
        run: |
          python3 scripts/setup-postgres-tests.py
          python3 -m unittest discover -q
      - name: Build standalone executable
        run: bash scripts/build-linux.sh
      - name: Smoke-test frozen app and persistent settings
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/family-bot-smoke
          XDG_CONFIG_HOME: ${{ runner.temp }}/family-bot-config
          PORT: '18080'
          TRADING_BOT_ROLE: dashboard
        run: |
          unset DISPLAY WAYLAND_DISPLAY
          mkdir -p "$XDG_DATA_HOME"
          ./dist/FamilyTradingBot-linux-x86_64 > "$RUNNER_TEMP/family-bot.log" 2>&1
          python3 scripts/smoke-linux.py
      - name: Save executable and update manifest
        uses: actions/upload-artifact@v4
        with:
          name: family-trading-bot-linux-${{ github.sha }}
          path: |
            dist/FamilyTradingBot-linux-x86_64
            dist/linux-x86_64-update.json
          if-no-files-found: error
          retention-days: 14
