name: Colmex integration
on:
  push:
    branches: ['main', 'codex/colmex-scanner-integration', 'codex/colmex-history-backfill', 'codex/signal-service-separation', 'codex/market-session-gating']
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: trading_bot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TRADING_TEST_DATABASE_URL: host=127.0.0.1 port=5432 dbname=trading_bot_test user=postgres password=test-only sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'psycopg[binary,pool]>=3.2,<4' certifi tzdata reportlab pypdf
      - run: python scripts/setup-postgres-tests.py
      - run: python -m unittest test_colmex_integration test_managed_assets test_scanner test_forex_market_hours test_yahoo_feed test_market_sessions test_alpaca_feed test_family_upgrade test_kraken_intraday -q
      - run: node --test web/*.test.mjs
