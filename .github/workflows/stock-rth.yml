name: Stock RTH and extended-hours regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stock-session-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: trading_bot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TRADING_TEST_DATABASE_URL: host=127.0.0.1 port=5432 dbname=trading_bot_test user=postgres password=test-only sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements-runtime.txt pypdf
      - name: Prepare disposable database
        run: python scripts/setup-postgres-tests.py
      - name: Verify RTH candles, scanner isolation, and extended-hours watches
        run: >-
          python -m unittest
          test_stock_rth test_alpaca_feed test_scanner test_rsi_pb
          test_stock_rsi_watch test_stock_reports test_market_sessions
          test_managed_assets -v
