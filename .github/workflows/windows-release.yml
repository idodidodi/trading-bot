name: Windows standalone release
on:
  workflow_call:
    inputs:
      release_version:
        required: true
        type: string
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set coordinated build version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python scripts/release-version.py apply
      - name: Install Windows runtime and build dependencies
        run: python -m pip install -r windows-build-requirements.txt
      - name: Verify scanner
        run: |
          python -m unittest discover -q
          if ($LASTEXITCODE -ne 0) { throw 'Scanner tests failed' }
      - name: Build executable and update manifest
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Smoke-test standalone app
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'family-bot-smoke'
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          Start-Process -FilePath (Resolve-Path 'dist/FamilyTradingBot.exe')
          $Ready = $false
          for ($Attempt = 0; $Attempt -lt 45; $Attempt++) {
            Start-Sleep -Seconds 1
            try {
              $Health = Invoke-RestMethod 'http://127.0.0.1:8080/health'
              $Updates = Invoke-RestMethod 'http://127.0.0.1:8080/api/updates'
              if ($Health.ok -and $Health.dry_run -and $Updates.supported) { $Ready = $true; break }
            } catch {}
          }
          Get-Process FamilyTradingBot -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $Ready) { throw 'Standalone Windows app did not start correctly' }
      - name: Save executable and update manifest
        uses: actions/upload-artifact@v4
        with:
          name: family-trading-bot-windows-${{ github.sha }}
          path: |
            dist/FamilyTradingBot.exe
            dist/windows-update.json
          if-no-files-found: error
          retention-days: 14
